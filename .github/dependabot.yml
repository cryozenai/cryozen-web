version: 2

updates:
  # Next, React, and Tailwind move quickly, and this site pins several of them
  # exactly. Without this, those pins rot silently.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine noise, so review attention goes to the majors.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # @types/node's major IS the Node major it describes, so it is not an
      # independent dependency: it moves with .nvmrc and engines.node, in one
      # commit. `npm run check:node-pins` enforces that; this only keeps
      # Dependabot from opening the pull request that would violate it.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # ESLint 10 crashes eslint-config-next 16.x: the eslint-plugin-react it
      # bundles throws inside usedPropTypes under the new rule API, so `npm run
      # lint` dies before linting a single file. Drop this once
      # eslint-config-next ships an ESLint 10 compatible plugin set.
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      # typescript-eslint (reached through eslint-config-next) declares
      # peerDependencies typescript ">=4.8.4 <6.1.0", so any TypeScript at or
      # above 6.1 - not just 7 - breaks linting: npm errors ERESOLVE on
      # install, and typescript-eslint refuses unsupported versions. The
      # package.json pin "~6.0.3" matches; 6.0.x patches still flow. Widen
      # this (and the pin) only when typescript-eslint raises that peer
      # range, not when a new TypeScript ships. See
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: "typescript"
        versions:
          - ">=6.1"

  # The workflow pins actions by major tag; this keeps those majors current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
