name: CI

on:
  pull_request:
  push:
    branches: [main]

# A superseded run tells you nothing, so cancel it and keep the queue short.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # `.nvmrc` is the single version source for local and CI. It is one of
      # three Node pins that must name the same major; the check below enforces
      # that, so change all three together and let it confirm the result.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Needs the install: it reads the resolved @types/node, not the range.
      - name: Check Node pins
        run: npm run check:node-pins

      # Covers the pin check's own failing branch, which nothing else exercises
      # while the pins agree.
      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      # `next build` type-checks the whole project, so this covers TypeScript
      # too. No GITHUB_TOKEN is provided on purpose: the build must stay green
      # when the GitHub Releases API is unreachable, which is exactly the
      # fallback path lib/releases.ts implements.
      - name: Build
        run: npm run build
