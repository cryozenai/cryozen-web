version: 2

updates:
  # Next, React, and Tailwind move quickly, and this site pins several of them
  # exactly. Without this, those pins rot silently.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine noise, so review attention goes to the majors.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # @types/node's major IS the Node major it describes, so it is not an
      # independent dependency: it belongs to the same lockstep as .nvmrc and
      # engines.node. Letting Dependabot raise it alone would type-check the
      # project against APIs the pinned runtime does not have. Bump it in the
      # same commit that moves .nvmrc and engines.node, and never on its own.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  # The workflow pins actions by major tag; this keeps those majors current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
